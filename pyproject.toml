[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-vision-object-tracking"
version = "0.1.0"
description = "A reproducible OpenCV object-detection and visual-servoing baseline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.scripts]
run-vision-demo = "vision_demo.run_demo:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

